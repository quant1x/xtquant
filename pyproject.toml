[build-system]
requires = ["setuptools>=78.0.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant1x-xtquant"
description = "Quant1X XtQuant"
authors = [{name = "wangfeng", email = "wangfengxy@sina.cn"}]
license = {text = "MIT license"}
keywords = ["quant1x", "xtquant"]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = [
    #"setuptools~=78.0.0",
    #"twine~=6.1.0",
    #"wheel~=0.45.1",
    "pymongo~=4.7.0",
    "future~=1.0.0",
    "numpy~=2.3.0",
    "pandas~=2.3.0",
    "PyYAML~=6.0.2",
    "pywin32==311",
]

[project.urls]
Homepage = "https://gitee.com/quant1x/xtquant"

[project.optional-dependencies]
test = [
    "setuptools~=78.0.0",
    "twine~=6.1.0",
    "wheel~=0.45.1",
    "pymongo~=4.7.0",
    "future~=1.0.0",
    "numpy~=2.3.0",
    "pandas~=2.3.0",
    "PyYAML~=6.0.2",
    "pywin32==311",
]

[tool.setuptools]
packages = {find = {include = ["xtquant", "xtquant.*"]}}
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"xtquant" = ["*.dll", "*.pyd", "*.ini", "*.log4cxx"]
"xtquant.config" = ["*.lua", "*.ini", "*.json", "*.txt", "*.log4cxx"]
"xtquant.xtbson" = ["*.pyd", "*.pyi", "*.typed"]

[tool.setuptools_scm]
# setuptools-scm 自动从 git tag 读取版本号
# git tag 格式: v2025.5.26 -> version 2025.5.26
local_scheme = "no-local-version"
